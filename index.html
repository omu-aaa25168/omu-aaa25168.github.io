<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おすすめの食べ物</title>
    <script>
        function updateClock() {
            // 現在時刻を取得
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            var year = now.getFullYear();
            var month = now.getMonth() + 1;
            var date = now.getDate();
            
            // 1桁の場合は0を付ける
            if (hours < 10) hours = '0' + hours;
            if (minutes < 10) minutes = '0' + minutes;
            if (seconds < 10) seconds = '0' + seconds;
            
            // 年月日、時刻を表示
            var timeString = year + '年' + month + '月' + date + '日' + hours + ':' + minutes + ':' + seconds;
            document.getElementById('clock').innerHTML = timeString;
            
            
        }
        
        // 1秒ごとにupdateClock関数を実行
        setInterval(updateClock, 1000);
        
        // ページ読み込み時に即座に表示
        window.onload = updateClock;
    </script>
</head>
<body>
    <h1>現在時刻</h1>
    <div id="clock" style="font-size: 48px; font-weight: bold; color: blue;">
        00:00:00
    </div>
    <header>Webシステム構築基礎　第2回課題　　井野川夕花(AAA25168)</header>
    <h1>おすすめの食べ物</h1>
    <img src="https://images.unsplash.com/photo-1545809278-56c8739d74e1?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" width="400" alt="おすすめの食べ物の写真">

    <p>
        私のおすすめは小籠包です。
        <br>
        最初に割るときの肉汁があふれ出てくるのを見ると、さらに食欲をそそります。
        <br>
        肉汁とお肉の旨味が絶妙なバランスでとってもおいしいです！
    </p>

    <a href="second.html">2ページ目へ</a>
</body>
</html>
